[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sg-linkedin-job-market-analytics"
version = "0.1.0"
description = "Data preparation and analysis utilities for a Singapore LinkedIn job-market EDA project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Goh Kun Ming" }]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
sg-linkedin-jobs = "sg_linkedin_jobs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
